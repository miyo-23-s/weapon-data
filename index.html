<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>武器資料 | WEAPON DATABASE</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-main: #0b0712;
      --bg-panel: #15101f;
      --bg-panel-open: #1b1428;
      --purple: #6d4aa8;
      --purple-dark: #3d2860;
      --silver: #c7c4d0;
      --silver-dark: #716c7c;
      --text-main: #eeeeF3;
      --text-sub: #aaa5b7;
    }

    body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(109, 74, 168, 0.16), transparent 28%),
        radial-gradient(circle at 80% 70%, rgba(109, 74, 168, 0.10), transparent 30%),
        var(--bg-main);
      color: var(--text-main);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;
      line-height: 1.8;
    }

    /* ページ全体 */
    .container {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 40px 18px 70px;
    }

    /* 虹色の小さなアクセント */
    .lights {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 18px;
    }

    .light {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      box-shadow: 0 0 10px currentColor;
    }

    .light:nth-child(1) {
      color: #ff4f81;
      background: currentColor;
    }

    .light:nth-child(2) {
      color: #ff9f43;
      background: currentColor;
    }

    .light:nth-child(3) {
      color: #ffe66d;
      background: currentColor;
    }

    .light:nth-child(4) {
      color: #65e572;
      background: currentColor;
    }

    .light:nth-child(5) {
      color: #52b8ff;
      background: currentColor;
    }

    .light:nth-child(6) {
      color: #8b6cff;
      background: currentColor;
    }

    .light:nth-child(7) {
      color: #d66cff;
      background: currentColor;
    }

    /* ヘッダー */
    .header {
      text-align: center;
      margin-bottom: 42px;
    }

    .header-label {
      margin-bottom: 5px;
      color: var(--silver-dark);
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 8vw, 48px);
      letter-spacing: 0.12em;
      font-weight: 600;
      color: var(--silver);
      text-shadow:
        0 0 18px rgba(180, 160, 220, 0.18);
    }

    .header-title {
      margin-top: 4px;
      color: #ffffff;
      font-size: clamp(15px, 4vw, 19px);
      letter-spacing: 0.25em;
    }

    .header-line {
      width: 100%;
      max-width: 620px;
      height: 1px;
      margin: 20px auto 0;
      background:
        linear-gradient(
          90deg,
          transparent,
          var(--silver-dark),
          var(--purple),
          var(--silver-dark),
          transparent
        );
    }

    /* 資料カテゴリ */
    details {
      position: relative;
      margin-bottom: 18px;
      border: 1px solid rgba(199, 196, 208, 0.35);
      border-radius: 8px;
      background:
        linear-gradient(
          135deg,
          rgba(109, 74, 168, 0.12),
          rgba(21, 16, 31, 0.96)
        );
      overflow: hidden;
      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.35),
        inset 0 1px rgba(255, 255, 255, 0.04);
    }

    details::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: var(--purple);
      box-shadow: 0 0 12px rgba(109, 74, 168, 0.7);
    }

    summary {
      position: relative;
      padding: 20px 22px 20px 28px;
      cursor: pointer;
      list-style: none;
      color: var(--silver);
      font-size: clamp(18px, 5vw, 24px);
      font-weight: 600;
      letter-spacing: 0.08em;
      user-select: none;
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    summary::-webkit-details-marker {
      display: none;
    }

    summary::after {
      content: "+";
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--silver-dark);
      font-size: 25px;
      font-weight: 300;
      transition: transform 0.25s ease;
    }

    details[open] summary {
      background: rgba(109, 74, 168, 0.14);
      color: #ffffff;
      border-bottom: 1px solid rgba(199, 196, 208, 0.18);
    }

    details[open] summary::after {
      content: "−";
      color: var(--silver);
    }

    summary:hover {
      background: rgba(109, 74, 168, 0.18);
    }

    /* 虹色の小さな印 */
    summary::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 13px;
      border-radius: 50%;
      background: #8b6cff;
      box-shadow: 0 0 10px #8b6cff;
      vertical-align: middle;
    }

    details:nth-of-type(2) summary::before {
      background: #52b8ff;
      box-shadow: 0 0 10px #52b8ff;
    }

    details:nth-of-type(3) summary::before {
      background: #ff4f81;
      box-shadow: 0 0 10px #ff4f81;
    }

    /* 本文 */
    .content {
      padding: 24px 28px 30px;
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.015),
          transparent
        );
      color: #d8d5df;
      font-size: clamp(15px, 4vw, 17px);
    }

    .content h2 {
      margin: 0 0 12px;
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(199, 196, 208, 0.2);
      color: var(--silver);
      font-size: clamp(19px, 5vw, 25px);
      letter-spacing: 0.05em;
    }

    .content h3 {
      color: #ffffff;
      font-size: clamp(17px, 4.5vw, 21px);
    }

    .content p {
      margin: 10px 0;
    }

    .content ul,
    .content ol {
      padding-left: 1.5em;
    }

    /* フッター */
    .footer {
      margin-top: 42px;
      text-align: center;
      color: #625d6d;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    /* スマホ */
    @media (max-width: 600px) {
      .container {
        padding: 28px 10px 50px;
      }

      .header {
        margin-bottom: 30px;
      }

      summary {
        padding: 18px 42px 18px 20px;
      }

      summary::after {
        right: 17px;
      }

      summary::before {
        margin-right: 9px;
      }

      .content {
        padding: 20px 18px 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">

      <div class="lights">
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
        <span class="light"></span>
      </div>

      <div class="header-label">
        CLASSIFIED DATABASE
      </div>

      <h1>WEAPON DATABASE</h1>

      <div class="header-title">
        武 器 資 料
      </div>

      <div class="header-line"></div>

    </header>


    <!-- 近接武器 -->
    <details>

      <summary>近接武器</summary>

      <div class="content">

        <h2>近接武器資料</h2>

        <p>
          ここに近接武器の資料が入ります。
        </p>

        <h3>テスト見出し</h3>

        <p>
          長い文章をここに入れることができます。<br>
          本文の量が増えても、スマートフォンでは画面幅に合わせて自動的に折り返されます。
        </p>

      </div>

    </details>


    <!-- 遠隔武器 -->
    <details>

      <summary>遠隔武器</summary>

      <div class="content">

        <h2>遠隔武器資料</h2>

        <p>
          ここに遠隔武器の資料が入ります。
        </p>

        <p>
          この部分にも長い資料を追加できます。
        </p>

      </div>

    </details>


    <!-- 爆発物・重火器 -->
    <details>

      <summary>爆発物・重火器</summary>

      <div class="content">

        <h2>爆発物・重火器資料</h2>

        <p>
          ここに爆発物・重火器の資料が入ります。
        </p>

      </div>

    </details>


    <footer class="footer">
      WEAPON DATABASE / INFORMATION ARCHIVE
    </footer>

  </div>

</body>
</html>
